    <text x="134" y="514" font-size="24" font-weight="700" fill="#101B35">Reusable defaults</text>
    <text x="134" y="544" font-size="18" fill="#475467">baseline model, Tool, and policy set</text>

    <text x="234" y="392" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#3448A8">02 / PROFILE PATCH</text>
    <text x="234" y="432" font-size="24" font-weight="700" fill="#101B35">Product or role selection</text>
    <text x="234" y="462" font-size="18" fill="#475467">explicit workflow-level override</text>

    <text x="334" y="310" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#3448A8">03 / HOME PATCH</text>
    <text x="334" y="350" font-size="24" font-weight="700" fill="#101B35">Durable user override</text>
    <text x="334" y="380" font-size="18" fill="#475467">personal preference across runs</text>

    <use data-icon="tabler-outline/settings" x="434" y="214" width="40" height="40"
