        fill="none" stroke="#3448A8" stroke-width="1" stroke-opacity="0.07"/>

  <g id="header" data-pptx-bounds="64 42 1152 108">
    <text x="64" y="66" font-family="Cascadia Mono, Consolas, monospace"
