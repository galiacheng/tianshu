    <text x="490" y="236" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#3448A8">04 / --patch</text>
    <text x="434" y="282" font-size="24" font-weight="700" fill="#101B35">Temporary run override</text>
    <text x="434" y="310" font-size="18" fill="#475467">closest to this user and this task</text>

    <text x="106" y="606" font-size="18" font-weight="700" fill="#3448A8">
