  <g id="decision-gate" data-pptx-bounds="64 408 1152 166">
    <rect x="64" y="408" width="1152" height="166" rx="14"
          fill="#101B35" stroke="#101B35"/>
    <text x="88" y="444" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#6EE7F0">DECISION GATE</text>
    <text x="88" y="486" font-size="32" font-weight="700" fill="#FFFFFF">
      Can the team explain the delta and repeat the run?
    </text>
    <rect x="88" y="514" width="486" height="40" rx="8" fill="#DFF5E5"/>
    <text x="108" y="540" font-size="17" font-weight="700" fill="#15803D">
      YES → explain → replay → scale the experiment
    </text>
    <rect x="594" y="514" width="598" height="40" rx="8" fill="#FCE8ED"/>
    <text x="614" y="540" font-size="17" font-weight="700" fill="#C2415B">
      NO → the result is anecdote, not decision-grade evidence
    </text>
