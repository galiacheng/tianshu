    <text x="1074" y="307" text-anchor="middle" font-size="16" fill="#101828">cost</text>
    <text x="1158" y="307" text-anchor="middle" font-size="16" fill="#101828">failure</text>
    <text x="956" y="344" font-size="16" fill="#475467">No post-hoc metric changes.</text>
