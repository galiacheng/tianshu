    <text x="738" y="316" font-size="16" fill="#475467">events · logs</text>
    <text x="738" y="342" font-size="16" fill="#475467">artifacts · costs</text>

    <path d="M888 276H924" fill="none" stroke="#3448A8" stroke-width="3"/>
