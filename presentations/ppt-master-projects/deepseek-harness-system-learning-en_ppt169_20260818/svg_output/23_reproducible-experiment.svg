    <text x="64" y="104" font-size="40" font-weight="700" fill="#101B35">
      A credible trial makes every comparison replayable
    </text>
    <text x="64" y="140" font-size="18" fill="#475467">
      Freeze the hypothesis, pair the systems, bind evidence to one run identity, then judge with one rubric.
    </text>
  </g>

