    <line x1="1125" y1="390" x2="1182" y2="430" stroke="#C2415B" stroke-width="3"/>
    <rect x="852" y="430" width="250" height="78" rx="7"
          fill="#E8F7ED" stroke="#15803D" stroke-width="2"/>
    <rect x="1108" y="430" width="104" height="78" rx="7"
          fill="#FFF0F2" stroke="#C2415B" stroke-width="2"/>
    <text x="977" y="466" text-anchor="middle" font-size="24" font-weight="700" fill="#15803D">Render ok</text>
    <text x="977" y="494" text-anchor="middle" font-size="18" fill="#475467">client settled</text>
    <text x="1160" y="462" text-anchor="middle" font-size="18" font-weight="700" fill="#C2415B">Render</text>
    <text x="1160" y="490" text-anchor="middle" font-size="18" font-weight="700" fill="#C2415B">failed</text>
