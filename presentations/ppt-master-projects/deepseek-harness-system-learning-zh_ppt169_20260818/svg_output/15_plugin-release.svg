    </text>
    <text x="302" y="590" font-size="18" fill="#475467">不修改已运行版本</text>
    <text x="652" y="590" font-size="18" font-weight="700" fill="#101B35">
      Rollback = explicit currentPackageId
    </text>
    <text x="1016" y="590" font-size="18" fill="#475467">版本状态属于 Package</text>
  </g>

  <g id="footer" data-pptx-bounds="64 652 1152 40">
