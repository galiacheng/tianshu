<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <defs>
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="9" refY="5"
