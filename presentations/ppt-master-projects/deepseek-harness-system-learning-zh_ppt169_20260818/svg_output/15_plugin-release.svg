    <text x="734" y="256" text-anchor="middle" font-size="24" font-weight="700" fill="#101B35">Approval</text>
    <text x="734" y="290" text-anchor="middle" font-size="18" fill="#475467">explicit gate</text>
    <text x="928" y="256" text-anchor="middle" font-size="24" font-weight="700" fill="#101B35">Starting</text>
    <text x="928" y="290" text-anchor="middle" font-size="18" fill="#475467">runtime activation</text>
    <text x="1125" y="256" text-anchor="middle" font-size="24" font-weight="700" fill="#F7FAFC">Run result</text>
    <text x="1125" y="292" text-anchor="middle" font-size="18" fill="#B9F4F7">ok / failed</text>

    <line x1="1125" y1="328" x2="1125" y2="390" stroke="#00C2D7" stroke-width="3"/>
    <line x1="1125" y1="390" x2="996" y2="430" stroke="#00C2D7" stroke-width="3"
