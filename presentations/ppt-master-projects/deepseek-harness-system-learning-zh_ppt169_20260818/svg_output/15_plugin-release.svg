    <line x1="1012" y1="272" x2="1038" y2="272" stroke="#00C2D7" stroke-width="3"
          marker-end="url(#arrow-cyan)"/>

    <rect x="68" y="216" width="168" height="112" rx="7" fill="#E8EEF7" stroke="#3448A8" stroke-width="2"/>
    <rect x="262" y="216" width="168" height="112" rx="7" fill="#E8EEF7" stroke="#3448A8" stroke-width="2"/>
    <rect x="456" y="216" width="168" height="112" rx="7" fill="#E8EEF7" stroke="#3448A8" stroke-width="2"/>
    <rect x="650" y="216" width="168" height="112" rx="7" fill="#E8EEF7" stroke="#3448A8" stroke-width="2"/>
    <rect x="844" y="216" width="168" height="112" rx="7" fill="#E8EEF7" stroke="#3448A8" stroke-width="2"/>
    <rect x="1038" y="216" width="174" height="112" rx="7" fill="#101B35" stroke="#00C2D7" stroke-width="3"/>

    <text x="152" y="256" text-anchor="middle" font-size="24" font-weight="700" fill="#101B35">Inspect</text>
    <text x="152" y="290" text-anchor="middle" font-size="18" fill="#475467">list → minimal query</text>
    <text x="346" y="256" text-anchor="middle" font-size="24" font-weight="700" fill="#101B35">Define</text>
    <text x="346" y="290" text-anchor="middle" font-size="18" fill="#475467">immutable Plugin</text>
    <text x="346" y="316" text-anchor="middle" font-size="18" fill="#475467">+ Package</text>
    <text x="540" y="256" text-anchor="middle" font-size="24" font-weight="700" fill="#101B35">Wait for page</text>
