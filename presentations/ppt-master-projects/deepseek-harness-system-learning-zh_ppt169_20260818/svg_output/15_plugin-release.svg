    <text x="64" y="122" font-size="42" font-weight="700" fill="#101B35">
      Run ok 不代表后续 Client Render 一定成功
    </text>
  </g>

  <g id="plugin-state-machine" data-pptx-bounds="56 172 1160 344">
    <line x1="236" y1="272" x2="262" y2="272" stroke="#00C2D7" stroke-width="3"
