<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720"
     data-pptx-page-role="content"
     font-family="Microsoft YaHei, Arial, sans-serif">
  <rect id="background" data-pptx-role="background"
        x="0" y="0" width="1280" height="720" fill="#101B35"/>
  <path id="engineering-grid" data-pptx-role="decoration"
        d="M160 0V720 M320 0V720 M480 0V720 M640 0V720 M800 0V720 M960 0V720 M1120 0V720 M0 120H1280 M0 240H1280 M0 360H1280 M0 480H1280 M0 600H1280"
        fill="none" stroke="#3448A8" stroke-width="1" stroke-opacity="0.38"/>

  <g id="header" data-pptx-bounds="64 30 1152 124">
    <text x="64" y="56" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" fill="#6EE7F0" letter-spacing="1">30 / 60 / 90 DAYS · GOVERNED ADOPTION</text>
    <text x="64" y="104" font-size="42" font-weight="700" fill="#FFFFFF">
      把 90 天变成采用决策，而不是一次演示
    </text>
    <text x="64" y="140" font-size="18" fill="#C7D2E8">
      架构、治理与证据是三根支柱；每一个里程碑都必须同时增强三者。
    </text>
  </g>

  <g id="supports" data-pptx-bounds="64 184 320 372">
    <rect x="64" y="184" width="320" height="110" rx="12"
          fill="#182747" stroke="#00C2D7" stroke-width="2"/>
    <text x="86" y="217" font-family="Cascadia Mono, Consolas, monospace"
          font-size="17" font-weight="700" fill="#6EE7F0">ARCHITECTURE</text>
    <text x="86" y="250" font-size="18" font-weight="700" fill="#FFFFFF">Plugin 接缝保持显式</text>
    <text x="86" y="276" font-size="16" fill="#C7D2E8">runtime · provider · tool · context</text>

    <rect x="64" y="315" width="320" height="110" rx="12"
          fill="#182747" stroke="#D97706" stroke-width="2"/>
    <text x="86" y="348" font-family="Cascadia Mono, Consolas, monospace"
          font-size="17" font-weight="700" fill="#F8C56D">GOVERNANCE</text>
    <text x="86" y="381" font-size="18" font-weight="700" fill="#FFFFFF">策略包裹每一个接缝</text>
    <text x="86" y="407" font-size="16" fill="#C7D2E8">身份 · 审批 · 密钥 · 审计</text>

    <rect x="64" y="446" width="320" height="110" rx="12"
          fill="#182747" stroke="#65C77A" stroke-width="2"/>
    <text x="86" y="479" font-family="Cascadia Mono, Consolas, monospace"
          font-size="17" font-weight="700" fill="#86E49B">EVIDENCE</text>
    <text x="86" y="512" font-size="18" font-weight="700" fill="#FFFFFF">一个 run_id 串起故事</text>
    <text x="86" y="538" font-size="16" fill="#C7D2E8">事件 · 日志 · 产物 · 结果</text>
  </g>

  <g id="roadmap-staircase" data-pptx-bounds="430 184 786 372">
    <path d="M430 556H1216" fill="none" stroke="#60739F" stroke-width="2"/>

    <rect x="454" y="396" width="220" height="160" rx="12"
          fill="#E8EEF7" stroke="#A9B7D5" stroke-width="2"/>
    <text x="476" y="431" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#3448A8">DAY 30 / PROVE</text>
    <text x="476" y="466" font-size="19" font-weight="700" fill="#101B35">冻结实验</text>
    <text x="476" y="496" font-size="16" fill="#475467">成对 A/B 基线</text>
    <text x="476" y="520" font-size="16" fill="#475467">负责人 + 唯一 run_id</text>
    <text x="476" y="544" font-size="16" fill="#475467">共享成功标尺</text>

    <rect x="696" y="296" width="220" height="260" rx="12"
          fill="#FFF6E8" stroke="#D97706" stroke-width="2"/>
    <text x="718" y="331" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#9A4D00">DAY 60 / GOVERN</text>
    <text x="718" y="366" font-size="19" font-weight="700" fill="#101B35">构建控制外壳</text>
    <text x="718" y="398" font-size="16" fill="#475467">Policy adapter</text>
    <text x="718" y="424" font-size="16" fill="#475467">身份 + 密钥控制</text>
    <text x="718" y="450" font-size="16" fill="#475467">审计接收器 + 证据包</text>
    <text x="718" y="476" font-size="16" fill="#475467">重放 + 失败演练</text>
    <text x="718" y="520" font-size="16" font-weight="700" fill="#9A4D00">闸门：可解释、可重复？</text>

    <rect x="938" y="196" width="254" height="360" rx="12"
          fill="#E5F7EA" stroke="#65C77A" stroke-width="2"/>
    <text x="960" y="231" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#15803D">DAY 90 / DECIDE</text>
    <text x="960" y="266" font-size="19" font-weight="700" fill="#101B35">有条件采用</text>
    <text x="960" y="300" font-size="16" fill="#475467">生产负责人 + SLO</text>
    <text x="960" y="326" font-size="16" fill="#475467">获批 Provider + tools</text>
    <text x="960" y="352" font-size="16" fill="#475467">回滚 + 事件路径</text>
    <text x="960" y="378" font-size="16" fill="#475467">采用 + 财务指标</text>
    <rect x="960" y="410" width="210" height="54" rx="9" fill="#15803D"/>
    <text x="1065" y="443" text-anchor="middle"
          font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#FFFFFF">PASS → ADOPT</text>
    <rect x="960" y="478" width="210" height="54" rx="9" fill="#FCE8ED"/>
    <text x="1065" y="511" text-anchor="middle"
          font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" font-weight="700" fill="#C2415B">HOLD → CLOSE GAPS</text>
  </g>

  <g id="decision-rule" data-pptx-bounds="64 584 1152 54">
    <rect x="64" y="584" width="1152" height="54" rx="10"
          fill="#22345B" stroke="#3448A8"/>
    <text x="88" y="618" font-size="18" font-weight="700" fill="#FFFFFF">
      只有当架构 + 治理 + 证据同时可解释、可重复时，才进入采用。
    </text>
  </g>

  <g id="footer" data-pptx-bounds="64 652 1152 40">
    <text x="64" y="676" font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" fill="#A9B7D5">K-011 · K-013 · K-019 · K-026</text>
    <text x="1216" y="676" text-anchor="end"
          font-family="Cascadia Mono, Consolas, monospace"
          font-size="18" fill="#6EE7F0">P24 / 24</text>
  </g>
</svg>
